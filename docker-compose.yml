# =============================================================================
# ProjectXY — Sovereign Architecture Docker Compose
# Production-hardened: 12 services, TLS via Traefik, self-healing health checks
# =============================================================================

services:

  # ── REVERSE PROXY / TLS TERMINATION ────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Traefik dashboard (disable in production)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik_dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    networks:
      - projectxy-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── POSTGRESQL + PGVECTOR ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: projectxy
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - projectxy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projectxy"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: 1g
    cpus: "1.0"

  # ── NEO4J GRAPH DATABASE ───────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.16.0
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - projectxy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    mem_limit: 2g
    cpus: "1.5"

  # ── REDIS (Pub/Sub + Cache + Rate Limiting) ────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - projectxy-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 384m

  # ── ZOOKEEPER (Kafka dependency) ───────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - projectxy-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/2181' 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 384m

  # ── KAFKA (Event Streaming) ────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    restart: unless-stopped
    depends_on:
      zookeeper: { condition: service_healthy }
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - projectxy-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/29092' 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 90s
    mem_limit: 1g
    cpus: "1.0"

  # ── KAFKA TOPIC SETUP (one-shot) ───────────────────────────────────────────
  kafka-setup:
    image: confluentinc/cp-kafka:7.5.3
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }
    networks:
      - projectxy-net
    command: |
      bash -c "
        echo '[KAFKA-SETUP] Creating required topics...'
        for topic in firewall_events compliance_events threat_feed infrastructure_telemetry ai_agent_telemetry mobile_session_events auth_events siem_alerts; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic $$topic --partitions 3 --replication-factor 1
          echo \"[KAFKA-SETUP] Topic: $$topic OK\"
        done
        echo '[KAFKA-SETUP] All topics ready.'
      "

  # ── OLLAMA (Local LLM — llama3.2) ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - projectxy-net
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
    mem_limit: 6g
    cpus: "3.0"

  # ── DB MIGRATIONS (one-shot) ────────────────────────────────────────
  alembic-upgrade:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/projectxy
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/projectxy
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - projectxy-net
    command: ["migrate"]

  # ── DATA SEEDING (one-shot) ───────────────────────────────────────────────
  backend-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/projectxy
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/projectxy
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      PYTHONPATH: /app
    depends_on:
      alembic-upgrade: { condition: service_completed_successfully }
      neo4j: { condition: service_healthy }
    networks:
      - projectxy-net
    command: ["seed"]

  # ── BACKEND (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.local
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/projectxy
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/projectxy
      # Graph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # Cache / Messaging
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # LLM
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
      # App
      PYTHONPATH: /app
      ENVIRONMENT: production
      AUTH_BYPASS_ENABLED: "false"
      LOG_LEVEL: INFO
    depends_on:
      alembic-upgrade: { condition: service_completed_successfully }
      backend-seed: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      ollama: { condition: service_healthy }
    networks:
      - projectxy-net
    mem_limit: 3g
    ports:
      - "8001:8000"
    cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # WebSocket support
      - "traefik.http.routers.backend-ws.rule=Host(`localhost`) && PathPrefix(`/api/v1/ws`)"
      - "traefik.http.routers.backend-ws.entrypoints=websecure"
      - "traefik.http.routers.backend-ws.tls=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - 113
    # ...

  # ── FRONTEND (Next.js) ─────────────────────────────────────────────────────
  # ── FRONTEND (Next.js) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ✅ FIX 1: Point to the backend container service name during the build phase
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    env_file: .env.local
    environment:
      # ✅ FIX 2: Ensure runtime remains mapped to the backend service container
      BACKEND_URL: http://backend:8000
      # ✅ FIX 3: Update the browser-facing URL to match your Traefik secure domain setup
      NEXT_PUBLIC_API_URL: "https://localhost"
      NEXT_PUBLIC_DEV_MODE: "false"
      NEXT_PUBLIC_FAST_LOGIN: "true"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - projectxy-net
    mem_limit: 1g
    cpus: "1.0"

    # Keep your Traefik labels below as they are...


    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      # Separate into clear HTTP and HTTPS strategies
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      # Explicit network declaration for Traefik routing
      - "traefik.docker.network=projectxy-net"

# ── VOLUMES ─────────────────────────────────────────────────────────────────
volumes:
  database_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  ollama_models:


# ── NETWORKS ─────────────────────────────────────────────────────────────────
networks:
  projectxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24