# ==============================================================================
# Project Heimdall — Sovereign Cyber Intelligence Platform Proxy Surface
# Core System Gateway Traefik Orchestration Configuration [traefik.yml]
# ==============================================================================

# ── GLOBAL RUNTIME CONSTRAINTS ────────────────────────────────────────────────
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ── MONITORING & MANAGEMENT API SURFACE ───────────────────────────────────────
api:
  dashboard: true
  insecure: true   # Platform Dashboard active on port :8080 for internal analytics

# ── LIFECYCLE MONITORING ──────────────────────────────────────────────────────
ping: {}

# ── ENCLAVE INGRESS ENTRYPOINTS ───────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
    # Local HTTPS redirection removed to prevent development token verification loops

  websecure:
    address: ":443"
    http:
      tls: {}

# ── CERTIFICATE RESOLVER STORAGE MATRIX ───────────────────────────────────────
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/server.crt
        keyFile: /certs/server.key

# ── CONTAINER NETWORKING PROVIDERS ────────────────────────────────────────────
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    # 💡 FIXED: version constraints are dropped from file to comply with Traefik v3 rules.
  file:
    directory: /etc/traefik/dynamic/
    watch: true

# ── OPERATIONS TELEMETRY LOGGING ──────────────────────────────────────────────
log:
  level: INFO

accessLog:
  format: json
